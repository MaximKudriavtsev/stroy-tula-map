services:
  server:
    build:
      context: ./services/backend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:3000"
    volumes:
      - ./services/backend:/app
      - server_node_modules:/app/node_modules
  web:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./services/frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

volumes:
  server_node_modules:
  web_node_modules:
  web_next:
  postgres_data:
