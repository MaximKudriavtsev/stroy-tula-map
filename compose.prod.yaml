services:
  server:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4000:3000"
    restart: unless-stopped
    # Системное хранилище хоста с сертификатами Минцифры:
    # на хосте они ставятся через update-ca-certificates.
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/certs/ca-certificates.crt:ro
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca-certificates.crt
  web:
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  postgres:
    restart: unless-stopped
