# Скопировать на сервер:
# sudo cp deploy/nginx/gorodvdele.ru.conf /etc/nginx/sites-available/gorodvdele.ru
# sudo ln -sf /etc/nginx/sites-available/gorodvdele.ru /etc/nginx/sites-enabled/
# sudo rm -f /etc/nginx/sites-enabled/default
# sudo nginx -t && sudo systemctl reload nginx
#
# Затем HTTPS:
# sudo certbot --nginx -d gorodvdele.ru -d www.gorodvdele.ru

server {
    listen 80;
    listen [::]:80;
    server_name gorodvdele.ru www.gorodvdele.ru;

    client_max_body_size 20m;

    location /object {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
