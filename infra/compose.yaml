services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: tula
      POSTGRES_PASSWORD: tula
      POSTGRES_DB: tula
    ports:
      - "5432:5432"
    volumes:
      - tula_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tula -d tula"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tula
      MINIO_ROOT_PASSWORD: tula-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tula_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-47Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 tula tula-secret; do sleep 1; done
        mc mb --ignore-existing local/tula
        echo bucket-ready

volumes:
  tula_pg:
  tula_minio:
